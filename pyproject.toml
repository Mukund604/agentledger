[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentledger"
version = "0.1.0"
description = "Transactional shared memory for multi agent systems: guarded commits, conflict detection, checkpoints and cascading retraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["agentledger"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
